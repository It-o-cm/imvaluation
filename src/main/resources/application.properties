# HTTP server
quarkus.http.port=8090

# Taille maximale d'un corps de requete. La valeur par defaut du framework est
# de 10 Mo, et le catalogue reel d'un magasin la depasse : les 109 204 articles
# du 07039 pesent 10,4 Mo, et chaque colonne ajoutee au flux partage rapproche
# un peu plus les autres fichiers de la limite. Un catalogue refuse en HTTP 413
# ne donne aucune erreur metier -- l'import n'est jamais appele -- donc la
# limite est posee ici, explicitement, avec de la marge, plutot que subie.
# L'importeur lit le flux par tranches : la limite compte des octets, elle ne
# les met pas en memoire.
quarkus.http.limits.max-body-size=64M

# Changement de mot de passe imposé après la première connexion. Activé par défaut :
# c'est le garde-fou qui empêche le compte d'amorçage de rester sur son mot de passe
# initial. Il n'est relâché qu'en développement, pour la commodité locale.
app.password-change.enforced=true
%dev.app.password-change.enforced=false
%test.app.password-change.enforced=false
%test.quarkus.http.test-port=8091

# Configuration de la base de données
quarkus.datasource.db-kind=h2
quarkus.datasource.username=username
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

# Configuration Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# --------------------------------------------------
# Authentification
# --------------------------------------------------
# Les comptes sont désormais en base (entité AppUser annotée @UserDefinition),
# la déclaration en fichier est donc supprimée.

# Authentification par formulaire : utilisée par le navigateur.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/ui/login
quarkus.http.auth.form.error-page=/ui/login?error=true
quarkus.http.auth.form.landing-page=/ui/offers
quarkus.http.auth.form.post-location=/j_security_check
quarkus.http.auth.form.username-parameter=j_username
quarkus.http.auth.form.password-parameter=j_password

# Clé de chiffrement du cookie de session (AES-256 après hachage SHA-256, 16 caractères
# minimum). Une clé versionnée dans le dépôt permettrait de forger un cookie valide et
# donc d'usurper n'importe quel compte : elle vient de l'environnement, sans valeur de
# repli, afin que le démarrage échoue plutôt que de tourner avec un secret connu.
%prod.quarkus.http.auth.session.encryption-key=${VALUATION_SESSION_KEY}
%dev.quarkus.http.auth.session.encryption-key=dev-only-not-for-production-0123456789
%test.quarkus.http.auth.session.encryption-key=test-only-not-for-production-01234567

# Authentification HTTP Basic : conservee en parallele du formulaire.
# Les clients CSV, GraphQL et de valorisation envoient un en-tete Basic ;
# sans cette ligne, ils recoivent la page de connexion au lieu d'une reponse.
# Basic est un mecanisme integre a Quarkus : aucune extension n'est requise.
# Sa priorite (2000) est superieure a celle du formulaire (1000), donc une requete
# portant un en-tete Authorization est traitee par Basic avant le formulaire.
quarkus.http.auth.basic=true

# Ressources accessibles sans authentification : strictement ce que la page de connexion
# charge, soit elle-même et ses deux feuilles de style. Les autres feuilles et scripts ne
# servent que des écrans déjà authentifiés et se chargent sans être déclarés ici.
quarkus.http.auth.permission.public.paths=/ui/login,/ui/base.css,/ui/auth.css
quarkus.http.auth.permission.public.policy=permit

# Les API (imports CSV, GraphQL, valorisation) s'authentifient en Basic et attendent une
# reponse, jamais une redirection vers un ecran. Cette politique force ce mecanisme sur
# leurs chemins, sans quoi l'authentification par formulaire les renvoie vers /ui/login.
quarkus.http.auth.permission.api.paths=/valuation,/display-valuation,/returns/*,/graphql,/stores/import,/store-groups/import,/products/import,/product-families/import,/product-category-storages/import,/prices/import,/offers/import
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.api.auth-mechanism=basic

# Compte créé au premier démarrage lorsque la table des utilisateurs est vide. Le mot de
# passe vient de l'environnement : un mot de passe par défaut versionné donnerait un accès
# administrateur à quiconque lit le dépôt. Le démarrage échoue si la variable est absente.
valuation.bootstrap.admin.username=admin
%prod.valuation.bootstrap.admin.password=${VALUATION_ADMIN_PASSWORD}
%dev.valuation.bootstrap.admin.password=admin
%test.valuation.bootstrap.admin.password=admin

# Seeds the reference data (stores, products, prices, offers...) from the embedded CSV
# files under src/main/resources/seed/ when the database is empty. Enabled in dev only:
# the in-memory database is dropped at every start (including live reloads), and
# production catalogs come from the real import endpoints, never from demonstration data.
valuation.bootstrap.data.enabled=false
%dev.valuation.bootstrap.data.enabled=true

# Public base URL used to build password-reset links (report H3). It must never be derived from
# the request Host header, which an attacker controls: a forged Host would mint a legitimate reset
# mail pointing the token at the attacker's site. Required in production (from the environment),
# defaulted only for local dev and tests.
%prod.valuation.public-base-url=${VALUATION_PUBLIC_BASE_URL}
%dev.valuation.public-base-url=http://localhost:8090
%test.valuation.public-base-url=http://localhost:8090

# --- Demonstrator profile (shared qualification instance) ---------------
# A demonstrator is not a production instance and must not be run as one.
# The imposed password change is released here for a precise reason: the
# bootstrap account is ALSO what the store node and the register sign in
# with over HTTP Basic to deliver the referential, and a machine cannot
# fill a password form -- under %prod the engine simply refuses them with
# "Password change required before using the API".
%demo.app.password-change.enforced=false
%demo.valuation.bootstrap.admin.password=${VALUATION_ADMIN_PASSWORD:admin}
%demo.quarkus.http.auth.session.encryption-key=${VALUATION_SESSION_KEY:demo-only-not-for-production-0123456789}
%demo.valuation.public-base-url=${VALUATION_PUBLIC_BASE_URL:http://localhost:8090}
# The catalog arrives from the store node's deliveries. The embedded
# demonstration CSV files would be a SECOND origin for the same articles.
%demo.valuation.bootstrap.data.enabled=false
# What the demonstrator was fed survives a restart.
%demo.quarkus.hibernate-orm.database.generation=update

# CSRF — two layers (spec-durcissement-web §1).
# Layer 1, SameSite=Lax on the session cookie (report H4): Lax lets the top-level login navigation
# carry the cookie while withholding it from cross-site POSTs, so a browser that memorised the
# session does not join it to a forged cross-site form submission.
# Layer 2, a per-session double-submit token: CsrfTokenManager mints it into the 'csrf-token'
# cookie and every /ui form ({#csrf/} tag) / fetch (X-CSRF-TOKEN header) echoes it; CsrfFilter
# rejects a state-changing /ui request whose echoed token does not match the cookie. The classic
# quarkus-rest-csrf extension is reactive-only and cannot run on this RESTEasy-Classic app, so the
# equivalent is implemented in-app.
# EXEMPT from CSRF, by design: the login post /j_security_check (pre-session, security-layer), and
# the Basic-auth machine-to-machine APIs — GraphQL, the CSV imports, /consumptions and /returns — which carry
# no ambient session cookie for an attacker to abuse. See the 'api' permission set above.
quarkus.http.same-site-cookie.quarkus-credential.value=Lax
# The verification is off in the test profile so the many pre-existing /ui POST tests need no
# token rework; the token cookie and {#csrf/} rendering still run, and CsrfFilterTest re-enables
# the verification through a dedicated test profile.
%test.valuation.csrf.enabled=false

# Enable Virtual Threads (Project Loom)
quarkus.threading.virtual.enabled=true

# Configuration des logs
quarkus.log.level=INFO
quarkus.log.category."com.intermarche".level=DEBUG
quarkus.log.category."stdout".level=INFO

# Configuration de la console (ce que vous avez déjà est bien)
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG

quarkus.hibernate-orm.jdbc.batch_size=1000
quarkus.hibernate-orm.jdbc.order_inserts=true
quarkus.hibernate-orm.jdbc.order_updates=true

# --------------------------------------------------
# Assistant de redaction d'offre (Claude / Anthropic)
# --------------------------------------------------
# L'assistant traduit une description en langage naturel en brouillon de specification
# d'offre, valide par le moteur avant d'etre montre. Il reste hors de portee tant que la
# cle d'API n'est pas fournie : la cle ne vit jamais dans le depot, elle arrive par
# l'environnement. Le modele et le budget de tokens restent reglables sans toucher au code.
ai.anthropic.base-url=https://api.anthropic.com
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.model=claude-sonnet-4-5
ai.anthropic.max-tokens=4096
ai.anthropic.timeout-seconds=60
