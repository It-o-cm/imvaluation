# Comportement de chaque type d'offre / avantage, injecté dans le prompt de l'assistant
# de redaction (OfferDraftService) a cote du schema JSON. Le schema dit comment remplir,
# ces lignes disent ce que le type fait reellement.
#
# Le fichier est le seul endroit ou ces descriptions vivent : elles sont distillees du
# Javadoc des fabriques et des specifications du moteur. Un test d'exhaustivite
# (OfferTypeDescriptionsTest) verifie que chaque type enregistre dans OfferSchemaRegistry
# possede une entree ici, et reciproquement qu'aucune entree ne reference un type inconnu —
# une nouvelle fabrique sans description fait donc echouer la CI, la derive est impossible.
# Encodage UTF-8, charge comme les bundles de messages.

AMOUNT_PER_ITEM_DISCOUNT=Remise d'un montant fixe par unite achetee sur les lignes visees : chaque ligne ciblee recoit « montant x quantite », TTC, plafonne a sa base courante pour ne jamais devenir negative. « targets » accepte une entree par liste de prix ; un meme EAN dans deux cibles est refuse a la creation.
ANTI_WASTE_DISCOUNT=Remise anti-gaspillage par ligne, croissante a mesure que la date limite de consommation approche : chaque ligne portant un « bestBeforeDate » (eventuellement restreinte par « targetEans ») recoit la remise du palier le plus strict atteint selon ses jours restants (« maxRemainingDays »). Les lignes sans date sont ignorees silencieusement.
CARD_PROMOTION_DISCOUNT=Promotions portees par la carte de fidelite et transmises dans le panier (« basket.cardPromotions ») : chaque entree PERCENT (fraction de la base nette) ou AMOUNT (euros par unite) est synthetisee a la volee. Ne pas choisir ce type pour une promotion magasin classique : il ne se configure pas dans la table des offres.
COUPON_GRANT=Octroi de coupons : le panier gagne un coupon dont le montant suit des paliers (palier le plus haut atteint, tranches progressives ou pas repetiteur), en euros ou en points. L'avantage est purement informatif : il ne touche jamais le total du ticket, l'emission et la consommation du coupon appartiennent a la caisse.
DELIVERY=Frais de livraison, une seule offre par magasin : le prix se lit dans des paliers de distance (« maxDistance »), la distance etant calculee entre l'adresse du magasin et l'adresse de livraison (formule de Haversine).
DEPOSIT_BASKET=Location de paniers de consigne, une seule offre par magasin, conditionnee au mot-cle « Deposit basket » dans les instructions du panier : le nombre de paniers vaut ceil(volume total des articles / capacite d'un panier), facture au prix fixe TTC.
EGALIM_GUARD=Garde-fou EGAlim : plafonne la generosite promotionnelle cumulee de chaque ligne a son plafond legal (« cap x prix nominal ») en emettant une remise negative qui ramene la ligne exactement au plafond, et produit l'enregistrement ligne a ligne dans « egalim[] ». Il s'applique en toute fin de valorisation ; on ne l'utilise pas pour une promotion, mais pour encadrer les autres.
FREE_DELIVERY_THRESHOLD=Remise sur le prix de la livraison, par paliers de montant de marchandise achete : le palier le plus haut atteint s'applique, plafonne au prix effectif de la livraison.
GIFT_ITEM_DISCOUNT=Offre le moins cher (ou le plus cher) des produits contributeurs du declencheur : un « trigger » avec contributeurs (MINIMUM_QUANTITY ou MINIMUM_AMOUNT sur des articles) est obligatoire ; les quantites non entieres comptent pour le seuil mais ne sont pas offrables.
IMMEDIATE_VOUCHER=Remise immediate ciblant d'autres offres : « targetOfferClass » designe la ou les classes d'offres visees (nom canonique, simple ou fragment), « targetEans » les produits, la remise etant un montant fixe ou un pourcentage.
MEAL_VOUCHER=Eligibilite au titre-restaurant : declare le drapeau de famille produit requis (par ex. « FOOD ») et le montant maximal payable en titres-restaurant (« threshold »). Avantage purement informationnel, sans effet sur le total.
MESSAGE=Message editique pour la caisse, sans aucun effet monetaire : le « text » peut porter des variables resolues a la valorisation — {{total}} (total TTC courant), {{missingAmount}} (manque au seuil), {{storeName}}.
MIXED_BUNDLE=Offre panier mixte (menu, pack) : « contents » decrit les composants (EAN, quantite, substituts autorises) et le bundle vaut soit un prix fixe TTC (« bundlePrice »), soit une remise sur le prix normal des composants (« discount ») — les deux s'excluent mutuellement.
N+M=Offre du type « N payes + M remises » sur les EAN visees : « quantityToPay » est le nombre d'unites payees plein tarif, « discountedQuantity » le nombre d'unites remisees, choisies parmi les moins cheres (« CHEAPEST ») ou les plus cheres (« MOST_EXPENSIVE ») ; la remise est un pourcentage ou un montant pour l'ensemble des unites remisees.
NEW_PRICE_DISCOUNT=Nouveau prix unitaire cible : le client paie le prix declare, la remise absorbe la difference avec la base courante (max(0, base courante - nouveau prix x quantite)) ; un prix superieur ou egal au prix courant ne produit rien. « targets » accepte une entree par liste de prix.
SRP_GUARD=Garde-fou de revente a perte : releve une ligne au plancher SRP (prix d'achat x 1,10 pousse dans le flux prix) si les avantages cumules ont fait passer son net dessous. Sa specification est vide « {} », son arbitrage structurel le place en toute fin de valorisation, juste apres le garde-fou EGAlim. On ne l'utilise pas pour une promotion.
TICKET_DISCOUNT=Remise sur l'ensemble du ticket : un pourcentage (0 < v <= 100) de la base totale, ou un montant plat plafonne a la base pour que le ticket ne devienne jamais negatif. Combine a un trigger MINIMUM_AMOUNT sur le ticket, c'est le « 5 EUR des 50 EUR » canonique.
TIERED_DISCOUNT=Remise par paliers sur un montant ou une quantite : trois modes — « HIGHEST_REACHED » (le palier le plus haut atteint s'applique une fois sur toute la base), « PROGRESSIVE » (tranches marginales, chaque palier s'applique a sa propre tranche) et « PER_MULTIPLE » (un pas repetiteur, par exemple 1 EUR tous les 50 EUR). La portee est une liste d'EAN ou le ticket entier.
VAT_REFUND_DISCOUNT=Remise dont le montant vaut exactement la TVA de la base : sur le ticket entier (scope TICKET, sans targetEans) ou sur les lignes listees (scope ITEMS, targetEans requis). Un taux nul (cartes cadeaux) ne contribue pas.
VIGNETTE_DISCOUNT=Remise par catalogue de vignettes : chaque regle exige un nombre de vignettes (« vignettesRequired ») sur un EAN donne et accorde la remise correspondante (pourcentage ou montant).
VOUCHER_GRANT=Octroi de bons d'achat : le panier gagne un bon dont le montant suit les memes paliers que le COUPON_GRANT (palier le plus haut atteint, tranches progressives ou pas repetiteur), en euros ou en points. L'avantage est purement informatif : il ne touche jamais le total du ticket.
