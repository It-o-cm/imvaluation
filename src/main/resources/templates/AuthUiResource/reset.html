<!DOCTYPE html>
<html lang="{inject:i18n.lang}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{inject:i18n.get('auth.reset.pageTitle')}</title>
    <link rel="stylesheet" href="/ui/base.css">
    <link rel="stylesheet" href="/ui/auth.css">
</head>
<body class="login-body">
<main class="login-panel">
    <div class="login-brand">
        <span class="app-brand-mark"></span>
        <span class="app-brand-text">Valuation<b>admin</b></span>
    </div>

    {#if error}
    <div class="alert alert-error" role="alert">{error}</div>
    {/if}

    <form class="login-form" method="post" action="/ui/reset">
        {#csrf /}
        <input type="hidden" name="token" value="{token}">
        <label class="field">
            <span class="field-label">{inject:i18n.get('auth.reset.newPassword')}</span>
            <input type="password" name="password" autocomplete="new-password" required autofocus>
        </label>

        <label class="field">
            <span class="field-label">{inject:i18n.get('auth.reset.confirm')}</span>
            <input type="password" name="confirm" autocomplete="new-password" required>
        </label>

        <button class="btn btn-primary login-submit" type="submit">{inject:i18n.get('auth.reset.submit')}</button>
    </form>

    <p class="field-hint" style="margin-top:14px;text-align:center">
        <a href="/ui/login">{inject:i18n.get('auth.backToSignIn')}</a>
    </p>
</main>
</body>
</html>
