<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password &mdash; Valuation admin</title>
    <link rel="stylesheet" href="/ui/base.css">
    <link rel="stylesheet" href="/ui/auth.css">
</head>
<body class="login-body">
<main class="login-panel">
    <div class="login-brand">
        <span class="app-brand-mark"></span>
        <span class="app-brand-text">Valuation<b>admin</b></span>
    </div>

    {#if sent}
    <div class="alert alert-ok" role="status">
        If an account matches this address, a reset link has just been sent to it.
        It is valid for 30 minutes and can be used once.
    </div>
    {/if}

    <form class="login-form" method="post" action="/ui/forgot">
        <label class="field">
            <span class="field-label">Your e-mail address</span>
            <input type="email" name="email" autocomplete="email" required autofocus>
        </label>

        <button class="btn btn-primary login-submit" type="submit">Send the link</button>
    </form>

    <p class="field-hint" style="margin-top:14px;text-align:center">
        <a href="/ui/login">&larr; Back to sign in</a>
    </p>
</main>
</body>
</html>
