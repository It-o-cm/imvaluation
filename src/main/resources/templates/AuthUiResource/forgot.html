<!DOCTYPE html>
<html lang="{inject:i18n.lang}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{inject:i18n.get('auth.forgot.pageTitle')}</title>
    <link rel="stylesheet" href="/ui/base.css">
    <link rel="stylesheet" href="/ui/auth.css">
</head>
<body class="login-body">
<main class="login-panel">
    <div class="login-brand">
        <span class="app-brand-mark"></span>
        <span class="app-brand-text">Valuation<b>admin</b></span>
    </div>

    {#if sent}
    <div class="alert alert-ok" role="status">
        {inject:i18n.get('auth.forgot.sent')}
    </div>
    {/if}

    <form class="login-form" method="post" action="/ui/forgot">
        {#csrf /}
        <label class="field">
            <span class="field-label">{inject:i18n.get('auth.forgot.email')}</span>
            <input type="email" name="email" autocomplete="email" required autofocus>
        </label>

        <button class="btn btn-primary login-submit" type="submit">{inject:i18n.get('auth.forgot.submit')}</button>
    </form>

    <p class="field-hint" style="margin-top:14px;text-align:center">
        <a href="/ui/login">{inject:i18n.get('auth.backToSignIn')}</a>
    </p>
</main>
</body>
</html>
